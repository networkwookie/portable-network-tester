name: Build Raspberry Pi Images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - release

permissions:
  contents: write

jobs:
  build-image:
    name: Build Raspberry Pi OS Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-user-static \
            debootstrap \
            kpartx \
            parted \
            wget \
            xz-utils \
            zip

      - name: Download base Raspberry Pi OS image
        run: |
          mkdir -p build/images
          cd build/images

          # Download Raspberry Pi OS Lite (64-bit)
          wget -q --show-progress \
            https://downloads.raspberrypi.org/raspios_lite_arm64/images/raspios_lite_arm64-2024-03-15/2024-03-15-raspios-bookworm-arm64-lite.img.xz

          # Extract
          echo "Extracting image..."
          xz -d 2024-03-15-raspios-bookworm-arm64-lite.img.xz

          ls -lh

      - name: Customize image
        run: |
          cd build/images
          chmod +x ../../scripts/customize-image.sh
          sudo ../../scripts/customize-image.sh $(pwd)/2024-03-15-raspios-bookworm-arm64-lite.img

      - name: Compress image
        run: |
          cd build/images
          IMAGE_NAME="network-tester-$(date +%Y-%m-%d)-raspios-arm64.img"
          mv 2024-03-15-raspios-bookworm-arm64-lite-network-tester.img "$IMAGE_NAME"

          echo "Compressing image..."
          zip "${IMAGE_NAME}.zip" "$IMAGE_NAME"

          # Calculate checksums
          sha256sum "$IMAGE_NAME" > "${IMAGE_NAME}.sha256"
          sha256sum "${IMAGE_NAME}.zip" > "${IMAGE_NAME}.zip.sha256"

          ls -lh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: raspios-image
          path: |
            build/images/*.zip
            build/images/*.sha256
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/images/*.zip
            build/images/*.sha256
          body: |
            ## Raspberry Pi OS Image with Network Tester

            This is a ready-to-use Raspberry Pi OS image with the Network Tester pre-installed.

            ### What's Included
            - Raspberry Pi OS (64-bit, Lite)
            - Network Tester application (auto-starts on boot)
            - All dependencies pre-configured
            - LLDP daemon enabled

            ### Installation Instructions

            1. **Download the image:**
               - Download `network-tester-*-raspios-arm64.img.zip`
               - Verify checksum (optional): `sha256sum -c network-tester-*-raspios-arm64.img.zip.sha256`

            2. **Write to SD card (Linux/Mac):**
               ```bash
               unzip network-tester-*-raspios-arm64.img.zip
               sudo dd if=network-tester-*-raspios-arm64.img of=/dev/sdX bs=4M status=progress conv=fsync
               ```
               Replace `/dev/sdX` with your SD card device (find with `lsblk`)

            3. **Write to SD card (Windows):**
               - Use [Raspberry Pi Imager](https://www.raspberrypi.org/software/) or [balenaEtcher](https://www.balena.io/etcher/)
               - Select the extracted .img file
               - Select your SD card
               - Click "Write"

            4. **First Boot:**
               - Insert SD card into Raspberry Pi
               - Connect 7" touchscreen
               - Power on
               - **First boot takes 5-10 minutes** to install dependencies
               - Application will auto-start once installation completes

            ### Default Credentials
            - Username: `pi`
            - Password: `raspberry`
            - Hostname: `network-tester`

            ### Features
            - Network Tester auto-starts on boot
            - Touch-optimized UI for 7" display
            - SSH enabled by default
            - All network testing tools pre-configured

            ### Troubleshooting
            - Check installation log: `/var/log/network-tester-install.log`
            - Check application log: `/opt/network-tester/logs/network_tester.log`
            - Manual start: `sudo systemctl start network-tester`

            ### Image Details
            - Base: Raspberry Pi OS Lite (64-bit, Bookworm)
            - Architecture: ARM64 (aarch64)
            - Size: ~2GB (compressed), ~4GB (extracted)
            - Compatible with: Raspberry Pi 4 Model B, Pi 400, Pi 5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-docker-image:
    name: Build Docker Image for Testing
    runs-on: ubuntu-latest
    needs: build-image
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: yourusername/portable-network-tester
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
