[pytest]
# Add src directory to Python path
pythonpath = src

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test markers
markers =
    unit: Unit tests
    integration: Integration tests
    system: System tests (require hardware or comprehensive mocks)
    slow: Slow running tests

# Disable assertion rewriting that's causing import issues
addopts =
    -v
    --strict-markers
    --tb=short
    --assert=plain
